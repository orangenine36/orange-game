<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ORANGE-GAME</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background: #f7f7f7;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .left-panel {
            flex: 1;
            min-width: 0;
        }
        .right-panel {
            width: 220px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }
        .right-panel h3 {
            margin-top: 0;
            color: #e67e22;
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }
        .right-panel ul {
            padding-left: 18px;
            margin: 8px 0;
        }
        .right-panel li {
            margin-bottom: 6px;
        }
        .game-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h2 { margin-top: 0; }
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        .label { color: #555; }
        .value { font-weight: bold; }
        .warning { color: #d35400; }
        .highlight { color: #2980b9; }
        .bribe-info { color: #e67e22; }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-challenge { background: #27ae60; color: white; }
        .btn-challenge:disabled { background: #aaa; cursor: not-allowed; }
        .btn-bribe { background: #f39c12; color: white; }
        .btn-reset { background: #3498db; color: white; }
        .btn-restart { background: #8e44ad; color: white; }
        .btn-exit { background: #e74c3c; color: white; }
        .btn-continue { background: #2980b9; color: white; }
        .log {
            background: #fefefe;
            border: 1px solid #ddd;
            padding: 10px;
            min-height: 60px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .high-score { color: #8e44ad; }
    </style>
</head>
<body>
<div class="left-panel">
    <div class="game-title">🍊 ORANGE-GAME</div>
    <div class="card">
        <div class="stat"><span class="label">当前资金：</span><span class="value" id="money">1000</span></div>
        <div class="stat"><span class="label">当前连胜奖金：</span><span class="value" id="streakBonus">0</span></div>
        <div class="stat"><span class="label">当前等级：</span><span class="value" id="level">1</span></div>
        <div class="stat"><span class="label">挑战成本：</span><span class="value" id="cost">-</span></div>
        <div class="stat"><span class="label">获胜概率：</span><span class="value" id="prob">-</span></div>
        <div class="stat" id="bribeRow" style="display:none;"><span class="label bribe-info">贿赂提升概率：</span><span class="value bribe-info" id="bribeProb">-</span></div>
        <div class="stat"><span class="label">获胜奖金：</span><span class="value" id="reward">-</span></div>
        <hr>
        <div class="stat"><span class="label">主动重置次数：</span><span class="value warning" id="restart">0</span></div>
        <div class="stat"><span class="label">成本倍率：</span><span class="value warning" id="multiplier">1.0x</span></div>
        <div class="stat"><span class="label">🏆 历史最高资金：</span><span class="value high-score" id="highscore">1000 (无名)</span></div>
    </div>
    <div class="buttons" id="main-buttons">
        <button class="btn-challenge" id="btn-challenge" onclick="doChallenge()">🎲 开始挑战</button>
        <button class="btn-bribe" id="btn-bribe" onclick="doBribe()">💰 贿赂</button>
        <button class="btn-reset" id="btn-reset" onclick="resetProgress()">🔄 重置进度</button>
        <button class="btn-restart" onclick="restartGame()">🔁 重新开始</button>
        <button class="btn-exit" onclick="exitGame()">🚪 退出</button>
    </div>
    <div id="continue-buttons" style="display:none; margin-top:10px;">
        <button class="btn-continue" onclick="continueGame()">继续挑战下一级</button>
    </div>
    <div class="log" id="log">点击按钮开始游戏。可贿赂来暂时提高获胜概率。</div>
</div>

<div class="right-panel">
    <h3>📋 玩法说明</h3>
    <ul>
        <li>初始资金1000，每次挑战需支付成本。</li>
        <li>获胜获得奖金，等级提升；失败扣除当前连胜奖金的1/4，等级归1。</li>
        <li>主动重置进度（见好就收）会使后续成本上涨10%。</li>
        <li>💰 贿赂：每300元提高1%获胜概率，最高50%，仅下次挑战有效。</li>
        <li>🏆 打破历史最高资金可命名记录。</li>
    </ul>
</div>

<script>
    // 游戏核心数据
    let money = 1000;
    let streakBonus = 0;
    let level = 1;
    let restartCount = 0;
    const costPenaltyRate = 0.1;

    // 贿赂相关参数（调整后）
    const BRIBE_COST_PER_PERCENT = 300;   // 每300元提升1%概率
    const MAX_BRIBE_PROB = 0.50;          // 贿赂提升概率上限（50%）
    let bribeTotalSpent = 0;

    // 最高记录
    let highestMoney = 1000;
    let highestName = "无名";

    const levels = [
        { cost: 80,  prob: 0.65, reward: 140 },
        { cost: 150, prob: 0.55, reward: 320 },
        { cost: 300, prob: 0.4,  reward: 860 },
        { cost: 600, prob: 0.25, reward: 3000 },
        { cost: 1200,prob: 0.15, reward: 12000 }
    ];
    const maxLevel = levels.length;

    // 加载最高记录
    function loadHighScore() {
        const saved = localStorage.getItem('gambling_highscore');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                highestMoney = data.highest || 1000;
                highestName = data.name || "无名";
            } catch(e) {
                highestMoney = 1000;
                highestName = "无名";
            }
        }
    }
    function saveHighScore() {
        localStorage.setItem('gambling_highscore', JSON.stringify({
            highest: highestMoney,
            name: highestName
        }));
    }
    function updateHighScore() {
        if (money > highestMoney) {
            highestMoney = money;
            let name = prompt("恭喜！你打破了历史最高资金记录！请为你的记录命名：", "无名玩家");
            if (name === null || name.trim() === "") {
                name = "无名玩家";
            }
            highestName = name.trim();
            saveHighScore();
        }
        document.getElementById('highscore').textContent = highestMoney + ' (' + highestName + ')';
    }

    // 计算实际成本
    function getEffectiveCost(original) {
        return Math.floor(original * (1 + restartCount * costPenaltyRate));
    }

    // 计算实际获胜概率（含贿赂加成，上限50%）
    function getEffectiveProb(baseProb) {
        let bonus = (bribeTotalSpent / BRIBE_COST_PER_PERCENT) * 0.01;  // 转化为概率值
        return Math.min(baseProb + bonus, MAX_BRIBE_PROB);
    }

    // 更新界面
    function updateUI() {
        document.getElementById('money').textContent = money;
        document.getElementById('streakBonus').textContent = streakBonus;
        document.getElementById('level').textContent = level;
        document.getElementById('restart').textContent = restartCount;
        let mult = (1 + restartCount * costPenaltyRate).toFixed(1);
        document.getElementById('multiplier').textContent = mult + 'x';
        updateHighScore();

        const info = levels[level-1];
        if (level <= maxLevel) {
            document.getElementById('cost').textContent = getEffectiveCost(info.cost);
            document.getElementById('reward').textContent = info.reward;

            let baseProb = info.prob;
            let effectiveProb = getEffectiveProb(baseProb);
            document.getElementById('prob').textContent = (effectiveProb*100).toFixed(1) + '%';
            if (bribeTotalSpent > 0) {
                document.getElementById('prob').textContent += ' (原' + (baseProb*100).toFixed(1) + '%)';
                let bonusProb = effectiveProb - baseProb;
                document.getElementById('bribeProb').textContent = '+' + (bonusProb*100).toFixed(1) + '%';
                document.getElementById('bribeRow').style.display = 'flex';
            } else {
                document.getElementById('bribeRow').style.display = 'none';
            }
        } else {
            document.getElementById('cost').textContent = '--';
            document.getElementById('prob').textContent = '--';
            document.getElementById('reward').textContent = '--';
            document.getElementById('bribeRow').style.display = 'none';
        }

        const canAfford = level <= maxLevel && money >= getEffectiveCost(levels[level-1].cost);
        document.getElementById('btn-challenge').disabled = !canAfford;
        if (!canAfford && level <= maxLevel) {
            document.getElementById('log').textContent = `资金不足！当前挑战成本为 ${getEffectiveCost(levels[level-1].cost)}，无法继续。`;
        }
    }

    function log(msg) {
        document.getElementById('log').textContent = msg;
    }

    // 贿赂操作
    function doBribe() {
        if (level > maxLevel) {
            log("已经没有挑战了，无需贿赂。");
            return;
        }
        let input = prompt("输入贿赂金额（每300元提高1%获胜概率，最高50%）：", "");
        if (input === null) return;
        let amount = parseInt(input, 10);
        if (isNaN(amount) || amount <= 0) {
            alert("请输入有效的正整数金额。");
            return;
        }
        if (amount > money) {
            alert("资金不足！");
            return;
        }
        let baseProb = levels[level-1].prob;
        let currentProb = getEffectiveProb(baseProb);
        if (currentProb >= MAX_BRIBE_PROB) {
            alert("获胜概率已达到上限50%，无法继续贿赂。");
            return;
        }
        money -= amount;
        bribeTotalSpent += amount;
        let newProb = getEffectiveProb(baseProb);
        log(`贿赂成功！花费 ${amount} 元，当前获胜概率提升至 ${(newProb*100).toFixed(1)}% (已花费 ${bribeTotalSpent} 元)`);
        updateUI();
    }

    // 挑战
    function doChallenge() {
        if (level > maxLevel) {
            log("没有更高的挑战了！");
            return;
        }
        const lv = levels[level-1];
        const cost = getEffectiveCost(lv.cost);
        if (money < cost) {
            log("资金不足！");
            return;
        }
        money -= cost;
        let effectiveProb = getEffectiveProb(lv.prob);
        let msg = `支付成本 ${cost}，当前获胜概率 ${(effectiveProb*100).toFixed(1)}%，开始抽奖...\n`;

        // 挑战结束，贿赂立即失效
        bribeTotalSpent = 0;

        if (Math.random() < effectiveProb) {
            // 获胜
            money += lv.reward;
            streakBonus += lv.reward;
            level++;
            msg += `恭喜！赢得了 ${lv.reward} 奖金！`;
            if (level > maxLevel) {
                msg += " 你已通关所有等级！";
            }
            updateUI();
            log(msg);
            if (level > maxLevel) {
                alert("恭喜！你已打穿所有等级，游戏胜利！");
                document.getElementById('continue-buttons').style.display = 'none';
                streakBonus = 0;
                updateUI();
            } else {
                document.getElementById('continue-buttons').style.display = 'block';
            }
        } else {
            // 失败
            msg += "很遗憾，挑战失败。\n";
            if (streakBonus > 0) {
                let quarter = Math.floor(streakBonus / 4);
                if (quarter > 0) {
                    money = Math.max(0, money - quarter);
                    streakBonus -= quarter;
                    msg += `扣除当前连胜奖金的四分之一（${quarter}），剩余连胜奖金 ${streakBonus}`;
                } else {
                    msg += "连胜奖金太少，无需扣除。";
                }
            } else {
                msg += "当前没有连胜奖金，无扣除。";
            }
            level = 1;
            streakBonus = 0;
            msg += "\n进度已退回初始等级。";
            updateUI();
            log(msg);
            document.getElementById('continue-buttons').style.display = 'none';
        }
    }

    function continueGame() {
        document.getElementById('continue-buttons').style.display = 'none';
        doChallenge();
    }

    // 主动重置（见好就收）
    function resetProgress() {
        level = 1;
        restartCount++;
        streakBonus = 0;
        bribeTotalSpent = 0;
        let mult = (1 + restartCount * costPenaltyRate).toFixed(1);
        log(`进度已重置为第1级。主动重置次数：${restartCount}，成本倍率：${mult}x，当前连胜奖金已清零。`);
        updateUI();
        document.getElementById('continue-buttons').style.display = 'none';
    }

    // 重新开始
    function restartGame() {
        money = 1000;
        streakBonus = 0;
        level = 1;
        restartCount = 0;
        bribeTotalSpent = 0;
        updateUI();
        log("游戏已重新开始，所有进度、成本惩罚与贿赂已重置。");
        document.getElementById('continue-buttons').style.display = 'none';
        document.getElementById('btn-challenge').disabled = false;
    }

    function exitGame() {
        alert(`游戏结束！最终资金：${money}`);
        document.getElementById('btn-challenge').disabled = true;
        document.getElementById('btn-bribe').disabled = true;
        document.getElementById('btn-reset').disabled = true;
        document.getElementById('continue-buttons').style.display = 'none';
        log("游戏已退出，刷新页面重新开始。");
    }

    // 初始化
    loadHighScore();
    updateUI();
</script>
</body>
</html>
