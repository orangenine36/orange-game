<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>ORANGE-GAME · 连胜挑战</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .game-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(22, 27, 44, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 36px;
      box-shadow: 0 25px 50px -10px rgba(0,0,0,0.8);
      display: flex;
      flex-wrap: wrap;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .left-panel {
      flex: 2.2;
      min-width: 320px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .right-panel {
      flex: 1;
      min-width: 240px;
      background: rgba(12, 15, 24, 0.7);
      backdrop-filter: blur(4px);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      border-left: 1px solid rgba(255,255,255,0.1);
    }
    .game-title {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ff8c42;
      text-shadow: 0 0 20px rgba(255,140,66,0.5);
      text-align: center;
      margin-bottom: 0.3rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.8rem;
      background: rgba(255,255,255,0.03);
      border-radius: 24px;
      padding: 1.2rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b0b0c0;
      font-weight: 500;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      padding: 0.5rem 0;
    }
    .stat-value {
      font-weight: 700;
      color: #f0f0f0;
      text-shadow: 0 0 6px rgba(255,255,255,0.2);
    }
    .warning { color: #ff8c42; }
    .bribe-highlight { color: #fbbf24; }
    .streak-highlight { color: #ef4444; }
    .insurance-color { color: #2dd4bf; }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    button {
      background: #2a2f4b;
      border: none;
      color: #e0e0ff;
      font-weight: 600;
      padding: 0.8rem 1.5rem;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    button:hover {
      background: #3d4370;
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }
    .btn-challenge { background: #16a34a; color: white; }
    .btn-challenge:disabled { background: #555; cursor: not-allowed; }
    .btn-bribe { background: #d97706; }
    .btn-insurance { background: #0d9488; }
    .btn-reset { background: #2563eb; }
    .btn-restart { background: #7c3aed; }
    .btn-exit { background: #b91c1c; }
    .btn-continue { background: #0891b2; }

    .log-area {
      background: #0b0e17;
      border-radius: 18px;
      padding: 1rem 1.4rem;
      color: #b9c2d4;
      min-height: 70px;
      border: 1px solid #2d3548;
      font-weight: 500;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
    }

    .rules-box h3, .hall-title {
      color: #ff8c42;
      margin-bottom: 12px;
      font-size: 1.4rem;
      border-left: 4px solid #ff8c42;
      padding-left: 12px;
    }
    .rules-list li {
      margin-bottom: 10px;
      color: #aaa;
      line-height: 1.4;
      font-size: 0.9rem;
    }
    .record-list { list-style: none; }
    .record-list li {
      background: rgba(255,255,255,0.05);
      margin: 8px 0;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      color: #ddd;
    }
    .footer-note {
      margin-top: auto;
      color: #5b5b6b;
      font-size: 0.8rem;
    }
    @media (max-width: 750px) {
      .game-container { flex-direction: column; }
      .right-panel { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="left-panel">
    <div class="game-title">🍊 ORANGE-GAME</div>
    <div class="stats-grid" id="stats-container"></div>
    <div class="button-group">
      <button class="btn-challenge" id="btn-challenge">🎲 挑战</button>
      <button class="btn-bribe" id="btn-bribe">💰 贿赂</button>
      <button class="btn-insurance" id="btn-insurance">🛡️ 保险</button>
      <button class="btn-reset" id="btn-reset">🔄 重置</button>
      <button class="btn-restart" id="btn-restart">🔁 重开</button>
      <button class="btn-exit" id="btn-exit">🚪 退出</button>
    </div>
    <div id="continue-area" style="display: flex; justify-content: center; margin-top: 8px;"></div>
    <div class="log-area" id="log">🍊 欢迎！用策略和运气征服赌局。</div>
  </div>
  <div class="right-panel">
    <div class="rules-box">
      <h3>📜 玩法规则</h3>
      <ul class="rules-list">
        <li>💰 初始资金 <b>1000</b>，每次挑战支付成本。</li>
        <li>🎯 获胜得奖金并升级，失败扣连胜奖金 <b>1/3</b> 并归1级。</li>
        <li>🔄 主动重置：首次+5%，之后每次+3%，逐次递增。</li>
        <li>💸 贿赂提升概率，<b>前期便宜后期贵</b>，上限<b>70%</b>。</li>
        <li>🛡️ 保险：支付50%成本，免扣奖金。</li>
        <li>🔥 连胜≥3次额外+20%奖金。</li>
        <li>✨ 丰富随机事件 (30%触发)。</li>
      </ul>
    </div>
    <div>
      <h3 class="hall-title">🏆 个人名人堂</h3>
      <ul class="record-list" id="top3-list"><li>暂无记录</li></ul>
    </div>
    <div class="footer-note">8级挑战 · 通关率约3%</div>
  </div>
</div>
<script>
  (function() {
    // ============ 游戏状态 ============
    let money = 1000;
    let streakBonus = 0;
    let level = 1;
    let winStreak = 0;
    let restartCount = 0;
    let bribeSpent = 0;
    let insured = false;
    let topRecords = [];

    // 重置成本累进：首次+5%，之后每次+3%
    function getCostPenalty() {
      if (restartCount === 0) return 0;
      return 0.05 + (restartCount - 1) * 0.03;
    }

    const levels = [
      { cost: 60,  prob: 0.75, reward: 90 },
      { cost: 120, prob: 0.60, reward: 220 },
      { cost: 200, prob: 0.45, reward: 450 },
      { cost: 350, prob: 0.30, reward: 1000 },
      { cost: 600, prob: 0.18, reward: 2800 },
      { cost: 1000,prob: 0.10, reward: 8000 },
      { cost: 1800,prob: 0.05, reward: 25000 },
      { cost: 3000,prob: 0.02, reward: 100000 }
    ];
    const MAX_LEVEL = levels.length;

    function getBribeCostPerPercent() {
      return Math.floor(120 + (level - 1) * 35);
    }
    const MAX_PROB = 0.70;

    const EVENTS = [
      { desc: "🍀 捡到150元", effect: ()=> { money += 150; } },
      { desc: "💼 报销本次成本", effect: ()=> { money += getEffectiveCost(levels[Math.min(level,MAX_LEVEL)-1].cost); } },
      { desc: "📈 连胜奖金翻倍", effect: ()=> { streakBonus = Math.floor(streakBonus * 2); } },
      { desc: "💸 小偷偷走100元", effect: ()=> { money = Math.max(0, money - 100); } },
      { desc: "📉 扣除10%连胜奖金", effect: ()=> { let loss = Math.floor(streakBonus * 0.1); money = Math.max(0, money - loss); streakBonus -= loss; } },
      { desc: "🎁 奖金增加80元", effect: ()=> { money += 80; } },
      { desc: "🧧 获得当前等级成本一半", effect: ()=> { money += Math.floor(getEffectiveCost(levels[Math.min(level,MAX_LEVEL)-1].cost)/2); } },
      { desc: "⚡ 报销本次成本", effect: ()=> { money += getEffectiveCost(levels[Math.min(level,MAX_LEVEL)-1].cost); } },
      { desc: "🛡️ 获得临时护盾(无效果)", effect: ()=> {} }
    ];

    function getEffectiveCost(base) { return Math.floor(base * (1 + getCostPenalty())); }
    function getCurrentProb() {
      let base = levels[level-1].prob;
      let bonus = (bribeSpent / getBribeCostPerPercent()) * 0.01;
      return Math.min(base + bonus, MAX_PROB);
    }

    function updateUI() {
      const container = document.getElementById('stats-container');
      const lv = levels[level-1];
      const cost = (level <= MAX_LEVEL) ? getEffectiveCost(lv.cost) : '--';
      const prob = (level <= MAX_LEVEL) ? (getCurrentProb()*100).toFixed(1)+'%' : '--';
      const reward = (level <= MAX_LEVEL) ? lv.reward : '--';
      let bribeRow = '';
      if (level <= MAX_LEVEL && bribeSpent > 0) {
        let bonus = ((getCurrentProb() - lv.prob)*100).toFixed(1);
        bribeRow = `<div class="stat-item"><span>💰 贿赂提升</span><span class="stat-value bribe-highlight">+${bonus}%</span></div>`;
      }
      const insuranceRow = insured ? `<div class="stat-item"><span>🛡️ 保险</span><span class="stat-value insurance-color">已激活</span></div>` : '';
      const penalty = getCostPenalty();
      container.innerHTML = `
        <div class="stat-item"><span>💵 资金</span><span class="stat-value">${money}</span></div>
        <div class="stat-item"><span>🎯 等级</span><span class="stat-value">${level}</span></div>
        <div class="stat-item"><span>🔥 连胜</span><span class="stat-value streak-highlight">${winStreak}</span></div>
        <div class="stat-item"><span>💎 连胜奖金</span><span class="stat-value">${streakBonus}</span></div>
        <div class="stat-item"><span>📈 成本</span><span class="stat-value">${cost}</span></div>
        <div class="stat-item"><span>🎲 概率</span><span class="stat-value">${prob}</span></div>
        ${bribeRow}
        ${insuranceRow}
        <div class="stat-item"><span>🏅 奖金</span><span class="stat-value">${reward}</span></div>
        <div class="stat-item"><span>🔄 重置次数</span><span class="stat-value warning">${restartCount}</span></div>
        <div class="stat-item"><span>📊 成本倍率</span><span class="stat-value warning">${(1+penalty).toFixed(2)}x</span></div>
      `;
      document.getElementById('btn-challenge').disabled = (level > MAX_LEVEL || money < getEffectiveCost(levels[level-1]?.cost || Infinity));
    }

    function log(msg) { document.getElementById('log').textContent = msg; }

    function loadRecords() {
      try { topRecords = JSON.parse(localStorage.getItem('orange_top3')) || []; } catch { topRecords = []; }
      renderRecords();
    }
    function saveRecords() { localStorage.setItem('orange_top3', JSON.stringify(topRecords)); }
    function updateRecords(newMoney, newName) {
      let existing = topRecords.find(r => r.name === newName);
      if (existing) { if (newMoney > existing.money) existing.money = newMoney; }
      else topRecords.push({ money: newMoney, name: newName });
      topRecords.sort((a,b)=>b.money-a.money);
      topRecords = topRecords.slice(0,3);
      saveRecords();
      renderRecords();
    }
    function renderRecords() {
      const list = document.getElementById('top3-list');
      if (!topRecords.length) { list.innerHTML = '<li>暂无记录</li>'; return; }
      list.innerHTML = topRecords.map((r,i)=>`<li>${['🥇','🥈','🥉'][i]} ${r.money} (${r.name})</li>`).join('');
    }
    function checkRecord() {
      if (money <= 0) return;
      if (topRecords.length < 3 || money > (topRecords[topRecords.length-1]?.money||0)) {
        let name = prompt("🎉 进入个人前三！留下名字:", "挑战者");
        if (name) updateRecords(money, name.trim() || "匿名");
      }
    }

    function doBribe() {
      if (level > MAX_LEVEL) return;
      let costPer = getBribeCostPerPercent();
      let input = prompt(`贿赂金额(每${costPer}元+1%概率，上限70%):`, '');
      if (!input) return;
      let amt = parseInt(input);
      if (isNaN(amt) || amt<=0) return;
      if (amt > money) { alert('资金不足'); return; }
      if (getCurrentProb() >= MAX_PROB) { alert('已达上限'); return; }
      money -= amt;
      bribeSpent += amt;
      log(`💰 贿赂${amt}元，当前概率${(getCurrentProb()*100).toFixed(1)}%`);
      updateUI();
    }
    function buyInsurance() {
      if (level>MAX_LEVEL || insured) return;
      let price = Math.floor(getEffectiveCost(levels[level-1].cost)*0.5);
      if (money < price) { alert('资金不足'); return; }
      money -= price;
      insured = true;
      log(`🛡️ 保险已购买 (${price}元)`);
      updateUI();
    }
    function doChallenge() {
      if (level > MAX_LEVEL) return;
      let lv = levels[level-1];
      let cost = getEffectiveCost(lv.cost);
      if (money < cost) return;
      money -= cost;
      let prob = getCurrentProb();
      let hadInsurance = insured;
      bribeSpent = 0; insured = false;
      let msg = `🎲 支付${cost}，概率${(prob*100).toFixed(1)}%… `;
      if (Math.random() < prob) {
        let reward = lv.reward;
        winStreak++;
        if (winStreak >= 3) { let b = Math.floor(reward*0.2); reward += b; msg += `🔥连胜+${b} `; }
        money += reward; streakBonus += reward; level++;
        msg += `赢得${reward}！`;
        if (Math.random()<0.3) {
          let ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
          ev.effect(); msg += ` ✨${ev.desc}`;
        }
        if (level > MAX_LEVEL) { msg += " 🏆通关！"; document.getElementById('continue-area').innerHTML=''; }
        else document.getElementById('continue-area').innerHTML = '<button class="btn-continue" id="btn-continue">▶ 继续挑战</button>';
        updateUI();
        log(msg);
        if (level > MAX_LEVEL) { alert("🏆 通关！"); streakBonus=0; updateUI(); checkRecord(); }
      } else {
        msg += "❌ 失败。";
        if (!hadInsurance && streakBonus>0) {
          let loss = Math.floor(streakBonus/3);
          money = Math.max(0, money-loss); streakBonus -= loss;
          msg += `扣${loss}`;
        } else if (hadInsurance) msg += " 🛡️保险生效";
        winStreak=0; level=1; streakBonus=0;
        msg += " 归1级";
        document.getElementById('continue-area').innerHTML='';
        updateUI(); log(msg); checkRecord();
      }
    }
    function resetProgress() {
      level=1; restartCount++; winStreak=0; streakBonus=0; bribeSpent=0; insured=false;
      updateUI(); log(`🔄 重置进度，成本倍率${(1+getCostPenalty()).toFixed(2)}x`); checkRecord();
    }
    function restartGame() {
      money=1000; streakBonus=0; level=1; winStreak=0; restartCount=0; bribeSpent=0; insured=false;
      updateUI(); log('🔁 重新开始');
    }
    function exitGame() {
      document.getElementById('btn-challenge').disabled = true;
      log('👋 游戏结束'); checkRecord();
    }

    window.doBribe = doBribe;
    window.buyInsurance = buyInsurance;
    window.doChallenge = doChallenge;
    window.resetProgress = resetProgress;
    window.restartGame = restartGame;
    window.exitGame = exitGame;
    window.continueGame = ()=>{ document.getElementById('continue-area').innerHTML=''; doChallenge(); };

    loadRecords();
    updateUI();
    document.getElementById('btn-challenge').addEventListener('click', doChallenge);
    document.getElementById('btn-bribe').addEventListener('click', doBribe);
    document.getElementById('btn-insurance').addEventListener('click', buyInsurance);
    document.getElementById('btn-reset').addEventListener('click', resetProgress);
    document.getElementById('btn-restart').addEventListener('click', restartGame);
    document.getElementById('btn-exit').addEventListener('click', exitGame);
  })();
</script>
</body>
</html>
